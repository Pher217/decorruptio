repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-pyyaml]
  - repo: local
    hooks:
      - id: validate-registry
        name: validate source register
        entry: python -m uncorrupt.cli validate-registry
        language: system
        pass_filenames: false
        files: ^sources/
