services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: decorruptio
      POSTGRES_PASSWORD: decorruptio
      POSTGRES_DB: decorruptio
    # Host port 5435 — 5432/5433 are used by other local projects.
    # Must match DATABASE_URL in .env / .env.example.
    ports: ["5435:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]

volumes:
  pg:
