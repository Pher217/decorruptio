services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: uncorrupt
      POSTGRES_PASSWORD: uncorrupt
      POSTGRES_DB: uncorrupt
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]

  dagster:
    build: .
    command: dagster dev -m uncorrupt.pipelines.definitions -h 0.0.0.0
    env_file: [.env]
    depends_on: [postgres, minio]
    ports: ["3000:3000"]

  # The OpenAleph spike is kept OUT of the default path (spec §4: 2-week spike w/ exit criteria).
  # Bring up with:  docker compose --profile aleph up
  openaleph:
    profiles: ["aleph"]
    image: ghcr.io/openaleph/openaleph:latest

volumes:
  pg:
  minio:
