[project]
name = "uncorrupt"
version = "0.0.1"
description = "Follow public money; surface corruption-risk anomalies for human investigators."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "django>=5.2",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "beautifulsoup4>=4.15.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
    "pre-commit>=3.7",
    "types-pyyaml",
]
pdf = [
    "pypdf>=4.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "pypdfium2>=4.0",
    "pillow>=10.0",
]

[project.scripts]
uncorrupt = "uncorrupt.cli:main"

# Extension point 1 — adding a connector is registering it here.
[project.entry-points."uncorrupt.connectors"]
eu_ted = "uncorrupt.connectors.eu_ted.connector:EuTedConnector"
gleif = "uncorrupt.connectors.gleif.connector:GleifConnector"
ua_prozorro = "uncorrupt.connectors.ua_prozorro.connector:UaProzorroConnector"
co_secop_ii = "uncorrupt.connectors.co_secop_ii.connector:CoSecopIiConnector"
uk_contracts_finder = "uncorrupt.connectors.uk_contracts_finder.connector:UkContractsFinderConnector"

# Extension point 2 — adding an indicator is registering it here.
[project.entry-points."uncorrupt.indicators"]
i001_single_bidder = "uncorrupt.indicators.catalog.i001_single_bidder:SingleBidder"
i002_short_bid_window = "uncorrupt.indicators.catalog.i002_short_bid_window:ShortBidWindow"
i003_repeat_winner_share = "uncorrupt.indicators.catalog.i003_repeat_winner_share:RepeatWinnerShare"
i004_price_vs_estimate = "uncorrupt.indicators.catalog.i004_price_vs_estimate:PriceVsEstimate"
i005_direct_award_share = "uncorrupt.indicators.catalog.i005_direct_award_share:DirectAwardShare"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uncorrupt"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"src/uncorrupt/staging/migrations/*" = ["E501"]
"src/uncorrupt/graph/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["uncorrupt"]
mypy_path = "src"
plugins = ["pydantic.mypy", "mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# Strict typing on the guardrail-bearing modules.
[[tool.mypy.overrides]]
module = ["uncorrupt.core.*", "uncorrupt.register.*", "uncorrupt.vault.*"]
disallow_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["django.*", "rest_framework.*", "environ.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
DJANGO_SETTINGS_MODULE = "config.settings.test"

[tool.coverage.run]
source = ["uncorrupt"]

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
]
