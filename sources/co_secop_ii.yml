notes: >-
  Socrata API at https://www.datos.gov.co/resource/p6dx-8zbt.json (Procesos de
  Contratación). NOT OCDS-native — fields like modalidad_de_contratacion,
  proveedores, valor_total_adjudicacion, id_del_proceso, nit_entidad need
  mapping to OCDS. Rich corruption-relevant fields: direct awards, single-bidder
  counts (proveedores_que_manifestaron), price vs base (precio_base vs
  valor_total_adjudicacion). High enforcement gap — Colombia consistently
  scores poorly on global corruption indices.